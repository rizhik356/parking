<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Парковка</title>

    <link rel="stylesheet" href="../css/guest.css">
</head>

<body>

<div class="guest_wrap">

    <div class="guest_header">
        <div class="guest_title">
            Парковка мероприятия
        </div>

        <div class="guest_sync">
            <span class="guest_status_dot"></span>
            <span class="guest_status">
                Загрузка
            </span>
        </div>
    </div>

    <main class="guest_card">

        <div class="guest_label">
            Свободно мест
        </div>

        <div class="guest_free">
            0
        </div>

        <div class="guest_total">
            из <span class="guest_total_number">0</span> всего
        </div>

        <div class="guest_meter">
            <div class="guest_meter_fill"></div>
        </div>

    </main>

    <div class="guest_footer">
        Данные обновляются автоматически
    </div>

</div>

<script src="../config.js"></script>
<script src="../guest.js"></script>

</body>
</html>
